<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/" [attr.aria-label]="i18n.t('app.brandAria')">
     
      <span class="brand-text">
        <strong>Chasqui Tech</strong>
        <small>{{ i18n.t('app.brandSubtitle') }}</small>
      </span>
    </a>
    <nav class="topnav" [attr.aria-label]="i18n.t('app.navAria')">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        {{ i18n.t('app.navDemo') }}
      </a>
      <a routerLink="/como-funciona" routerLinkActive="active">{{ i18n.t('app.navHow') }}</a>
    </nav>
    <div class="topbar-meta">
      <select
        class="lang-select"
        [value]="i18n.language()"
        (change)="setLanguage($event)"
        [attr.aria-label]="i18n.t('app.language')"
      >
        @for (language of i18n.languages; track language.code) {
          <option [value]="language.code" [selected]="language.code === i18n.language()">
            {{ language.label }}
          </option>
        }
      </select>
    </div>
  </header>

  <main class="main">
    <router-outlet />
  </main>

  <footer class="footer">
    <p>{{ i18n.t('app.footerCredit') }}</p>
    <p class="footer-note">{{ i18n.t('app.footerNote') }}</p>
  </footer>
</div>
